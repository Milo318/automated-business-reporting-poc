[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-business-reporting-poc"
version = "1.1.0"
description = "Reconciled KPI reporting with deterministic metrics and optional AI narrative."
requires-python = ">=3.11"

[project.scripts]
business-report = "business_reporting.cli:main"
report-autonomy-benchmark = "business_reporting.autonomous_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.16.8"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
